<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; padding: 14px 16px; width: 300px; font: 13px/1.4 system-ui, sans-serif;
           color: #16161d; background: #fff; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid #eee; }
    th { font-weight: 600; color: #666; font-size: 12px; }
    td.num { font-variant-numeric: tabular-nums; }
    .ok { color: #2a7a3a; } .warn { color: #b26b00; } .blocked { color: #b3261e; font-weight: 600; }
    .foot { margin-top: 10px; color: #777; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Today</h1>
  <table>
    <thead><tr><th>Site</th><th>Time</th><th>Screens</th><th>Ext</th><th>Status</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="foot" id="foot"></div>
  <div class="foot"><a href="#" id="settings">Settings</a></div>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
